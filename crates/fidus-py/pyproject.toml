[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "fidus"
description = "Zero-trust on-screen positioning for the caller's own window (Stage 1 binding)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
manifest-path = "Cargo.toml"
# Rust lib name is `fidus_py` (avoids the dependency-name clash); the
# importable Python module stays `fidus` via the pyo3 init symbol.
module-name = "fidus"
