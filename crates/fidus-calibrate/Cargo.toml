[package]
name = "fidus-calibrate"
description = "fidus B-layer calibrators: L9 Crosshair (layer-shell), L0 Anchor (universal fallback), L10 GradientField (feature-gated)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# L10 GradientField was rejected (spec §4.2: the design is self-contradictory).
# The flag is kept as an inert no-op so existing build configs keep working.
gradient-field = []

[dependencies]
fidus-core = { workspace = true }
thiserror = { workspace = true }
